{{- if or (eq .Values.mode "deployment") (eq .Values.mode "mcp") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vexviper.fullname" . }}
  labels: {{- include "vexviper.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "vexviper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "vexviper.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vexviper
          image: {{ include "vexviper.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if eq .Values.mode "mcp" }}
          args: ["mcp-serve", "--config", "/etc/vexviper/vexviper.yaml", "--transport", "http", "--addr", "0.0.0.0:{{ .Values.mcp.port }}", "--log-json"]
          ports:
            - name: mcp
              containerPort: {{ .Values.mcp.port }}
          {{- else }}
          args: ["watch", "--config", "/etc/vexviper/vexviper.yaml", "--log-json"{{- if .Values.metrics.enabled }}, "--listen", "0.0.0.0:{{ .Values.metrics.port }}"{{- end }}]
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 60
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 30
          {{- end }}
          {{- end }}
          env: {{- include "vexviper.env" . | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: {{- include "vexviper.volumeMounts" . | nindent 12 }}
      volumes: {{- include "vexviper.volumes" . | nindent 8 }}
{{- end }}
