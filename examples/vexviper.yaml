# VEXViper configuration. Every key can be overridden with an environment
# variable VEXVIPER_<SECTION>_<KEY> (e.g. VEXVIPER_BOMHORT_URL, VEXVIPER_LLM_PROVIDER).
# Secrets should come from the *_env indirections rather than the file.

bomhort:
  url: http://localhost:8080
  # api_key: ...              # or:
  api_key_env: BOMHORT_API_KEY   # X-API-Key for /api/v1/sboms/upload (AUTH_ENABLED=true)
  # service_token: ...        # alternatively the SERVICE_TOKEN (X-Service-Token)

llm:
  # heuristic : deterministic rules only, no network, no key (default; safe baseline)
  # openai    : any OpenAI-compatible /chat/completions endpoint
  # github    : GitHub Models — billed to your GitHub / Copilot account, auth with a GitHub token
  # copilot   : GitHub Copilot CLI in non-interactive mode (`copilot -p … -s`); uses your Copilot
  #             subscription, no API key: auth via `copilot` → /login, `gh auth login`, or GH_TOKEN
  # mcptool   : call a tool on an MCP server you run (VEXViper acts as MCP client)
  provider: heuristic
  # Assessments below this confidence are downgraded to under_investigation.
  min_confidence: 0.6
  # Let the LLM emit not_affected without deterministic evidence (govulncheck etc.). Dangerous.
  allow_unsupported_not_affected: false

  openai:
    base_url: https://api.openai.com/v1      # Azure, GitHub Models, Ollama (http://localhost:11434/v1), vLLM, LiteLLM...
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    timeout: 120s
    temperature: 0

  github:
    base_url: https://models.github.ai/inference
    model: openai/gpt-4.1-mini              # any id from https://github.com/marketplace/models
    token_env: GITHUB_TOKEN                 # fine-grained PAT with `models: read`, or Actions GITHUB_TOKEN with `models: read` permission
    timeout: 120s
    temperature: 0

  copilot:
    command: copilot                        # Copilot CLI binary
    # model: gpt-5                          # --model; empty = CLI default
    args: []                                # extra CLI args (e.g. ["--agent", "vex-triage"])
    in_repo: false                          # run inside the cloned product repo so Copilot may read code
    timeout: 180s

  mcp:
    transport: stdio                          # stdio | http
    command: my-triage-mcp-server             # stdio: process to spawn
    args: []
    env: {}
    url: http://localhost:3000/mcp            # http: streamable HTTP endpoint
    headers: {}                               # e.g. Authorization: Bearer ...
    tool: assess_vulnerability                # tool called with {system_prompt, prompt, request, schema}
    timeout: 120s

repo:
  cache_dir: .vexviper-cache
  # override: github.com/owner/name@v1.2.3   # force ONE repository for every SBOM (rarely useful)
  # Pin repositories per SBOM when the SBOM carries no usable VCS metadata
  # (e.g. pkg:generic roots). `match` is compared against the BOMHort SBOM id,
  # document_name and source_file; exact string or glob (path.Match). First hit wins.
  # `repo` is a URL or owner/name[@ref]; "{version}" expands to the version parsed
  # from the SBOM name (kubelb-1.4.2.spdx.json -> v1.4.2). Without @ref the parsed
  # version is used as ref automatically.
  sboms:
    - match: "kubelb-*"
      repo: kubermatic/kubelb
    - match: "my-service.cdx.json"
      repo: https://gitlab.example.com/team/my-service@release-{version}
    # - match: "3f1c…-uuid"                  # BOMHort SBOM id
    #   repo: acme/internal
  clone: true                                 # clone the product repo for code-level evidence
  govulncheck: true                           # run govulncheck when the product is a Go module

vex:
  author: VEXViper
  author_role: automated triage (LLM-assisted)
  # supplier: ACME Corp
  namespace: https://vexviper.dev/docs        # IRI prefix for document/statement IDs
  out_dir: ./vex
  upload: false                               # push to BOMHort after generation
  regenerate: false                           # also re-assess findings that already have a vex_status
                                              # (settled not_affected/fixed verdicts are kept; hard
                                              #  regenerate only via `vexviper generate --force`)

watch:
  interval: 15m
  state_file: .vexviper-cache/watch-state.json
  # Periodic re-assessment. BOMHort has no scheduler for VEX, so VEXViper owns it:
  # SBOMs are re-run once their last run is older than this, and findings whose
  # current status is under_investigation or affected get a fresh assessment when
  # BOMHort's newest statement for them is older than this. not_affected / fixed
  # verdicts are never revisited automatically (use --force). 0 disables.
  reassess_after: 168h   # 7 days

# Upper bound for one SBOM (clone + govulncheck + all assessments).
timeout: 30m
